<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Zeitlog actogram mark">
  <!-- App-icon plate -->
  <rect width="64" height="64" rx="14" fill="#0C0E14"/>

  <!-- Sleep bands drifting later each day (the non-24 actogram diagonal) -->
  <g fill="#E0A93B">
    <rect x="8"  y="11" width="26" height="6" rx="3"/>
    <rect x="15" y="20" width="26" height="6" rx="3"/>
    <rect x="22" y="29" width="26" height="6" rx="3"/>
    <rect x="29" y="38" width="26" height="6" rx="3"/>
    <rect x="36" y="47" width="20" height="6" rx="3"/>
  </g>

  <!-- Double-plot wrap-around: the band re-enters on the left -->
  <rect x="8" y="47" width="5" height="6" rx="2.5" fill="#D1D5DB"/>
</svg>
